name: 友商金融政策周报

on:
  schedule:
    - cron: '0 1,4,8,10 * * *'   # UTC，对应北京时间 09:00 / 12:00 / 16:00 / 18:00
  workflow_dispatch:              # 也支持在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖与浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取 9 家官网并出表（单次失败不阻断发布）
        continue-on-error: true
        run: python agent.py --verbose

      - name: 兜底：用仓库内已有 JSON 重新出表
        run: python agent.py --render-only

      - name: 生成首页 index.html
        run: cp "out/友商金融政策动态-周报表.html" out/index.html

      - name: 提交本周数据与产物
        run: |
          git config user.name "policy-agent"
          git config user.email "policy-agent@users.noreply.github.com"
          git add data out
          git commit -m "auto: $(date -u '+%Y-%m-%d %H:%M') crawl" || echo "no changes"
          git push

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
